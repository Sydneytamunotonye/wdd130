    <main>

            <input type="email" id="email" email="123@gmail.com" required><br>

            <fieldset>
                <legend>Message Purpose</legend>
                <label>
                    <input type="radio" id="General Inquiry" name="purpose" value="general">
                    General Inquiry
                </label>

                <label>
                    <input type="radio" id="General Inquiry" name="purpose" value="Reservation">

                </label>

                <label>
                    <input type="radio" id="General Inquiry" name="purpose" value="Suggestion">
                    Website Suggestion
                </label>
            </fieldset><br>

            <label>
                <label for="Name">Message</label>
                <input type="text" id="name" name="Message"><br>
            </label>

            <label>
                <label for="Name">Please Subscribe me to the monthly newsletter</label>
                <input type="checkbox" id="name" name="Subscribe"><br>
            </label>

            <button type="submit">Get In Touch!</button>
